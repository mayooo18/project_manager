<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crew Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style> body { background:#000; font-family: Inter, system-ui, sans-serif; } </style>
</head>
<body class="bg-black min-h-screen flex flex-col justify-center px-6">
  <div class="max-w-sm w-full mx-auto">
    <div class="text-center mb-8">
      <div class="mx-auto w-14 h-14 rounded-xl flex items-center justify-center mb-3" style="background:#7c2d12;">
        <span class="text-2xl" style="color:#ff8c5a;">👷</span>
      </div>
      <h1 class="text-white text-2xl font-bold">Crew Sign In</h1>
      <p class="text-gray-500 text-sm mt-1">Enter your phone number and PIN.</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
      <div class="mb-4 rounded-lg p-3 text-sm text-center border border-red-700 bg-red-900/30 text-red-200">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('crew.login') }}" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label class="block text-gray-400 text-sm mb-1">Phone number</label>
        <input name="phone" type="tel" inputmode="tel" autocomplete="tel" required
               class="w-full text-lg px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 text-white focus:outline-none focus:border-orange-500"
               placeholder="(555) 123-4567"/>
      </div>
      <div>
        <label class="block text-gray-400 text-sm mb-1">PIN</label>
        <input name="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" required
               class="w-full text-lg tracking-widest px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 text-white focus:outline-none focus:border-orange-500"
               placeholder="••••"/>
      </div>
      <button type="submit"
              class="w-full text-lg font-semibold py-3 rounded-xl bg-orange-500 hover:bg-orange-600 text-white">Sign in</button>
    </form>

    <p class="text-gray-600 text-xs text-center mt-6">Forgot your PIN? Ask your foreman to reset it.</p>
  </div>
</body>
</html>
