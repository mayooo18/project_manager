{% extends 'base.html' %}
{% block title %}Edit Worker{% endblock %}

{% block content %}
<div class="form-wrap">
  <div class="page-head"><h1>Edit Worker</h1></div>
  <form method="POST" class="card" style="padding:1.5rem;">
    {{ form.hidden_tag() }}
    <div class="field"><label>Name</label>{{ form.name() }}</div>
    <div class="field"><label>Daily Rate</label>{{ form.daily_rate() }}</div>
    <label style="display:flex;align-items:center;gap:.5rem;margin-bottom:1.1rem;color:var(--ink-700);font-size:.9rem;">
      {{ form.active(style="width:auto;") }} Active
    </label>

    <div style="border-top:1px solid var(--border);padding-top:1rem;">
      <p class="sect-label" style="margin-bottom:.75rem;">Crew portal login</p>
      <div class="field"><label>Phone (for crew login)</label>{{ form.phone() }}</div>
      <div class="field"><label>PIN (4–6 digits — set or reset; leave blank to keep)</label>{{ form.pin(autocomplete="off") }}</div>
    </div>

    <div class="form-foot">
      <a href="{{ url_for('workers') }}" class="c-accent" style="font-size:.88rem;">← Cancel</a>
      <button type="submit" class="btn">Save</button>
    </div>
  </form>
</div>
{% endblock %}
