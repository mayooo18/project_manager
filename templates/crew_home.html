<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Crew Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style> body { background:#000; font-family: Inter, system-ui, sans-serif; } </style>
</head>
<body class="bg-black min-h-screen">
  <div class="max-w-md mx-auto px-5 py-8">

    <div class="flex items-center justify-between mb-6">
      <div>
        <p class="text-gray-500 text-xs uppercase tracking-widest">Crew portal</p>
        <h1 class="text-white text-2xl font-bold">Hi, {{ worker.name }}</h1>
      </div>
      <a href="{{ url_for('crew.logout') }}" class="text-gray-400 text-sm border border-gray-700 rounded-lg px-3 py-1.5 hover:border-orange-500 hover:text-orange-400">Sign out</a>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
      <div class="mb-4 rounded-lg p-3 text-sm border {{ 'border-red-700 bg-red-900/30 text-red-200' if category == 'error' else 'border-green-700 bg-green-900/30 text-green-200' }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <div class="rounded-xl border border-gray-800 bg-gray-900/50 p-6 text-center">
      <p class="text-gray-300 text-sm">You're signed in.</p>
      <p class="text-gray-600 text-xs mt-2">Your assigned tasks and clock-in will appear here.</p>
    </div>

  </div>
</body>
</html>
